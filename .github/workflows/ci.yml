name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quotes
          POSTGRES_USER: quotes
          POSTGRES_PASSWORD: quotes
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quotes -d quotes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://quotes:quotes@localhost:5432/quotes
      JWT_SECRET: ci-secret-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run db:generate
      - run: npm run build
      - run: npm run lint
      - run: npm run test
