services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quotes
      POSTGRES_USER: quotes
      POSTGRES_PASSWORD: quotes_dev_only
    ports: ["5432:5432"]
    volumes: ["quotes_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotes -d quotes"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://quotes:quotes_dev_only@postgres:5432/quotes
      JWT_SECRET: change-me-in-development
      PORTAL_TOKEN_SECRET: change-me-portal-token-in-development
      PORT: 4000
    ports: ["4000:4000"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  quotes_pgdata:
