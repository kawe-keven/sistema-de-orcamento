<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Orçamentos · workspace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="brand"><span class="brand-mark">&gt;_</span><span>workspace</span></div>
      <button class="new-quote-button" data-action="new-quote"><span>+</span> Novo orçamento</button>
      <nav class="main-nav">
        <a class="nav-item active" href="#inicio" data-view="home"><span class="nav-icon">⌂</span> Início</a>
        <a class="nav-item" href="#orcamentos" data-view="quotes"><span class="nav-icon">▤</span> Orçamentos <span class="nav-count">8</span></a>

      <div id="view-container" class="view-container"></div>
    </main>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="store.js"></script>
  <script src="navbar/routes.js"></script>
  <script src="navbar/inicio.js"></script>
  <script src="navbar/orcamentos.js"></script>
  <script src="navbar/clientes.js"></script>
  <script src="navbar/modelos.js"></script>
  <script src="app.js"></script>
</body>
</html>
